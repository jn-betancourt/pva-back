name: CD

on:
  workflow_call:
    inputs:
      image-digest:
        required: true
        type: string
        description: "Digest SHA-256 de la imagen publicada en GHCR"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write       # Requerido para autenticacion OIDC con Azure
      contents: read

    steps:
      - name: Normalizar nombre del repositorio a minusculas
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Autenticacion en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sincronizar App Settings en Azure Web App
        uses: azure/cli@v2
        env:
          AZURE_RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_CORS_ORIGINS: ${{ secrets.PROD_CORS_ORIGINS }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        with:
          inlineScript: |
            if [ -n "$AZURE_RG" ] && [ -n "$PROD_DB_URL" ]; then
              echo "Sincronizando configuracion de base de datos y CORS en Azure Web App..."
              az webapp config appsettings set \
                --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
                --resource-group "$AZURE_RG" \
                --settings \
                  SPRING_DATASOURCE_URL="$PROD_DB_URL" \
                  SPRING_DATASOURCE_USERNAME="$PROD_DB_USER" \
                  SPRING_DATASOURCE_PASSWORD="$PROD_DB_PASSWORD" \
                  CORS_ALLOWED_ORIGINS="${PROD_CORS_ORIGINS:-http://localhost:4200}" \
                  PVA_JWT_SECRET="${PROD_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}"
            else
              echo "Variables de BD o Resource Group no detectadas. Omitiendo actualizacion de appsettings."
            fi

      - name: Desplegar imagen por digest en Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}@${{ inputs.image-digest }}

      - name: Notificar error si el despliegue o smoke test falla
        if: failure()
        run: |
          echo "::error::El despliegue en Azure Web App o la prueba de humo fallaron para la imagen ${{ inputs.image-digest }}."