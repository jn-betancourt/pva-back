name: Security

on:
  workflow_call:

jobs:
  sast-sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21 para analisis
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: SAST con CodeQL (Inicializacion)
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: SAST con CodeQL (Compilacion automatica)
        uses: github/codeql-action/autobuild@v3

      - name: SAST con CodeQL (Analisis de codigo)
        uses: github/codeql-action/analyze@v3

      - name: SCA con Trivy (Escaneo de dependencias en cadena de suministro)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Subir resultados SARIF de Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-sca