$kind: http-request
name: GET /api/v1/ventas/{{id_venta}}
url: "{{base_url}}/api/v1/ventas/{{id_venta}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Retorna detalle completo de la venta", function () {
          pm.expect(jsonData.id_venta).to.eql(Number(pm.environment.get("id_venta")));
          pm.expect(jsonData.items).to.be.an("array");
          pm.expect(jsonData.factura).to.be.an("object");
      });
    language: text/javascript
order: 3000
