$kind: http-request
name: POST /api/v1/turnos/{{id_turno}}/cerrar
url: "{{base_url}}/api/v1/turnos/{{id_turno}}/cerrar"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "monto_fisico_arqueo": 50000.00,
      "observaciones_cierre": "Cierre de turno normal en prueba Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Turno cerrado con arqueo ciego y estado CERRADO", function () {
          pm.expect(jsonData.estado).to.eql("CERRADO");
          pm.expect(jsonData.monto_fisico_arqueo).to.eql(50000.00);
          pm.expect(jsonData.discrepancia).to.be.a("number");
      });
    language: text/javascript
order: 4000
