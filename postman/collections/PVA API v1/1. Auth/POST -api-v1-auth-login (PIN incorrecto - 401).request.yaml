$kind: http-request
name: POST /api/v1/auth/login (PIN incorrecto - 401)
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre_usuario": "admin",
      "pin": "9999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Estructura de error estándar y código AUTH-PIN-INCORRECTO", function () {
          pm.expect(jsonData).to.have.property("error");
          pm.expect(jsonData).to.have.property("codigo");
          pm.expect(jsonData).to.have.property("detalle");
          pm.expect(jsonData.codigo).to.eql("AUTH-PIN-INCORRECTO");
      });
    language: text/javascript
order: 2000
