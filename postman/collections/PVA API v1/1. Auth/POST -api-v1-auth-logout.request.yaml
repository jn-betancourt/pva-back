$kind: http-request
name: POST /api/v1/auth/logout
url: "{{base_url}}/api/v1/auth/logout"
method: POST
headers:
  Authorization: Bearer {{temp_logout_token}}
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get("base_url") || "http://localhost:8080";
      pm.sendRequest({
          url: baseUrl + '/api/v1/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
              mode: 'raw',
              raw: JSON.stringify({ nombre_usuario: "admin", pin: "1234" })
          }
      }, function (err, res) {
          if (!err && res.code === 200) {
              pm.variables.set("temp_logout_token", res.json().token);
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 4000
