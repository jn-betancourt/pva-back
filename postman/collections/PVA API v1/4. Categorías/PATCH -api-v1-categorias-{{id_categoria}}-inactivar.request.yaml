$kind: http-request
name: PATCH /api/v1/categorias/{{id_categoria}}/inactivar
url: "{{base_url}}/api/v1/categorias/{{id_categoria_inactivar}}"
method: PATCH
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: beforeRequest
    code: |-
      const baseUrl = pm.environment.get("base_url") || "http://localhost:8080";
      const token = pm.environment.get("token");
      const rand = Math.floor(Math.random() * 1000000);
      pm.sendRequest({
          url: baseUrl + '/api/v1/categorias',
          method: 'POST',
          header: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
          },
          body: {
              mode: 'raw',
              raw: JSON.stringify({
                  nombre: "Cat Inactivar " + rand,
                  descripcion: "Para test de inactivacion"
              })
          }
      }, function (err, res) {
          if (!err && res.code === 201) {
              pm.variables.set("id_categoria_inactivar", res.json().id_categoria);
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Categoría inactivada con éxito (activo=false)", function () {
          pm.expect(jsonData.activo).to.eql(false);
      });
    language: text/javascript
order: 4000
