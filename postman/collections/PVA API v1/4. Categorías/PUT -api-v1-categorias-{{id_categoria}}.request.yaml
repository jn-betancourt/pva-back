$kind: http-request
name: PUT /api/v1/categorias/{{id_categoria}}
url: "{{base_url}}/api/v1/categorias/{{id_categoria}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nombre": "Bebidas y Refrescos {{id_categoria}}",
      "descripcion": "Descripción actualizada vía Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Nombre de categoría actualizado", function () {
          pm.expect(jsonData.nombre).to.include("Bebidas y Refrescos");
      });
    language: text/javascript
order: 3000
