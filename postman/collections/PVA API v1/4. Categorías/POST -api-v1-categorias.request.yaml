$kind: http-request
name: POST /api/v1/categorias
url: "{{base_url}}/api/v1/categorias"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nombre": "{{nombre_categoria}}",
      "descripcion": "Categoría de bebidas refrescantes"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rand = Math.floor(Math.random() * 1000000);
      pm.variables.set("nombre_categoria", "Bebidas " + rand);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Categoría creada con id_categoria", function () {
          pm.expect(jsonData.id_categoria).to.be.a("number");
          pm.expect(jsonData.activo).to.eql(true);
      });
      pm.environment.set("id_categoria", jsonData.id_categoria);
    language: text/javascript
order: 1000
