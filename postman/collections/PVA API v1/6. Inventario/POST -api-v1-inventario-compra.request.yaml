$kind: http-request
name: POST /api/v1/inventario/compra
url: "{{base_url}}/api/v1/inventario/compra"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_producto": {{id_producto}},
      "cantidad": 20,
      "costo_unitario": 2800.00,
      "id_referencia": "FAC-PROV-9988",
      "motivo_ajuste": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Compra registrada con tipo COMPRA", function () {
          pm.expect(jsonData.tipo_movimiento).to.eql("COMPRA");
          pm.expect(jsonData.id_producto).to.eql(Number(pm.environment.get("id_producto")));
          pm.expect(jsonData.cantidad).to.eql(20);
      });
      pm.test("Recálculo de CPP y nuevo saldo resultante", function () {
          pm.expect(jsonData.saldo_resultante).to.be.a("number");
          pm.expect(jsonData.nuevo_costo_promedio).to.be.a("number");
      });
    language: text/javascript
order: 1000
