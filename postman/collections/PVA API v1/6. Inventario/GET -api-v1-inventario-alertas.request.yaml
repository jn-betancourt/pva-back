$kind: http-request
name: GET /api/v1/inventario/alertas
url: "{{base_url}}/api/v1/inventario/alertas"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Retorna lista de alertas de stock (US-09)", function () {
          pm.expect(jsonData).to.be.an("array");
          if (jsonData.length > 0) {
              const item = jsonData[0];
              pm.expect(item).to.have.property("id_producto");
              pm.expect(item).to.have.property("nombre");
              pm.expect(item).to.have.property("stock_actual");
              pm.expect(item).to.have.property("stock_minimo");
              pm.expect(item).to.have.property("deficit");
              pm.expect(item.deficit).to.eql(item.stock_minimo - item.stock_actual);
          }
      });
    language: text/javascript
order: 2000
