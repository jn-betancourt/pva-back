$kind: http-request
name: PATCH /api/v1/operarios/{{id_operario}}/desbloquear
url: "{{base_url}}/api/v1/operarios/{{id_operario}}/desbloquear"
method: PATCH
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Operario desbloqueado e intentos_fallidos en 0", function () {
          pm.expect(jsonData.intentos_fallidos).to.eql(0);
      });
    language: text/javascript
order: 6000
