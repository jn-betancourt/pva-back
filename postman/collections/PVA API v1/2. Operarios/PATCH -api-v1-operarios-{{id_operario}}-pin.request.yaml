$kind: http-request
name: PATCH /api/v1/operarios/{{id_operario}}/pin
url: "{{base_url}}/api/v1/operarios/{{id_operario}}/pin"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "pin_nuevo": "5678"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("PIN actualizado correctamente", function () {
          pm.expect(jsonData).to.have.property("mensaje");
          pm.expect(jsonData.id_operario).to.eql(Number(pm.environment.get("id_operario")));
      });
    language: text/javascript
order: 5000
