$kind: http-request
name: GET /api/v1/operarios/{{id_operario}}
url: "{{base_url}}/api/v1/operarios/{{id_operario}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta < 1500 ms (RNF-01)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
      const jsonData = pm.response.json();
      pm.test("Detalle de operario coincide con id_operario", function () {
          pm.expect(jsonData.id_operario).to.eql(Number(pm.environment.get("id_operario")));
      });
    language: text/javascript
order: 3000
